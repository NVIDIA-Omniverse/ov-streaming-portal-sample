[tool.poetry]
name = "streaming-web-backend"
version = "0.1.0"
description = ""
authors = ["NVIDIA"]
readme = "README.md"
license = "SEE LICENSE IN LICENSE.txt"
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.12, <3.15"
fastapi = "0.141.1"
uvicorn = "^0.32.0"
aerich = "^0.9.1"
tortoise-orm = "^0.25.1"
httpx = "0.28.1"
pyjwt = "2.13.0"
websockets = "^13.0"
cachetools = "^5.5.0"
asyncache = "^0.3.1"
cryptography = "50.0.0"
starlette = "1.3.1"
setuptools = "80.10.2"
h11 = "^0.16.0"
opentelemetry-api = "^1.36.0"
opentelemetry-sdk = "^1.36.0"
opentelemetry-exporter-otlp = "^1.36.0"
opentelemetry-instrumentation-fastapi = "^0.57b0"
urllib3 = "2.7.0"
pyyaml = "^6.0.3"
protobuf = "6.33.5"
requests = "2.33.0"
mcp = "==1.28.1"


[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
pytest-asyncio = "1.3.0"
pytest = "9.0.3"
freezegun = "^1.5.1"
asgi-lifespan = "^2.1.0"
respx = "^0.22.0"
pytest-httpx = "0.36.2"
pygments = "2.20.0"
pytest-mock = "3.15.1"

[tool.poetry.scripts]
api = "app.main:start"
migrations = "app.main:migrations"
test-metrics = "scripts.metrics:test"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests/**/*.py"]

[tool.black]
line-length = 80

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
